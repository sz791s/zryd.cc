name: Website veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Quartz-Theme installieren
        run: npm install --no-save --package-lock=false --ignore-scripts @quartz-themes/default@1.0.1

      - name: Quartz-Plugins installieren
        run: npx quartz plugin install --from-config

      - name: Website bauen
        run: npx quartz build

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zu GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
